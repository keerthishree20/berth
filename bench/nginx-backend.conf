# The backends for the benchmark. nginx serving a fixed body, so the backend is
# never the thing being measured: it answers far faster than either proxy can
# forward.
worker_processes 2;
events { worker_connections 4096; }
http {
    access_log off;
    keepalive_requests 1000000;
    server { listen 9101; location / { return 200 "ok\n"; } }
    server { listen 9102; location / { return 200 "ok\n"; } }
}
