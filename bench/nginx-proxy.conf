# The comparison proxy. Configured the way a competent operator would, not the
# way that makes it slowest: keep-alive to the upstream, no access log, the
# same least-connections balancing Berth uses by default.
worker_processes WORKERS;
events { worker_connections 4096; }
http {
    access_log off;
    keepalive_requests 1000000;
    upstream backends {
        least_conn;
        server 127.0.0.1:9101;
        server 127.0.0.1:9102;
        keepalive 64;
    }
    server {
        listen PORT;
        location / {
            proxy_pass http://backends;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
