[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "berth-proxy"
version = "1.0.0"
description = "An HTTP reverse proxy and load balancer on asyncio. No dependencies."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "pytest-timeout>=2.3"]

[project.scripts]
berth = "berth.cli:main"

[tool.setuptools.packages.find]
include = ["berth*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --timeout=120"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
